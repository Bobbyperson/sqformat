[package]
name = "sqformat"
version = "1.2.1"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
similar = "3.2.0"
sqfmt-lib = { path = "../sqfmt-lib" }
sqfmt-lint = { path = "../sqfmt-lint" }
sqparse = { git = "https://github.com/Bobbyperson/sqparse.git", tag = "v0.5.0" }
toml = "1.1.6"
