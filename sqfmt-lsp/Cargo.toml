[package]
name = "sqformat-lsp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqfmt-lib = { path = "../sqfmt-lib" }
sqfmt-lint = { path = "../sqfmt-lint" }
sqparse = { git = "https://github.com/Bobbyperson/sqparse.git", tag = "v0.5.0" }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
tower-lsp-server = "0.23"
